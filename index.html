<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymLab Fitness - Comunnity</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">GYM<span>LAB FITNESS</span></div>
            <ul id="nav-links">
                <li id="user-display"></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <!-- Carrusel de publicaciones destacadas -->
        <section id="promo-section" class="promo-section">
            <div class="carousel" aria-live="polite">
                <div class="carousel-track">
                    <article class="slide">
                        <img src="images/background.png" alt="Promo 1">
                    </article>
                    <article class="slide">
                        <img src="images/background.png" alt="Promo 2">
                    </article>
                    <article class="slide">
                        <img src="images/background.png" alt="Promo 3">
                    </article>
                </div>
            </div>
            <div class="hero-logo">
                <img src="images/gml_verde.png" alt="GymLab Fitness">
            </div>
            <div class="title">
                <h1>Únete a la comunidad de entrenamiento más grande</h1>
                <p>Comparte tus progresos, encuentra compañeros de entrenamiento y accede a rutinas personalizadas.</p>
            </div>
            <div class="cta-buttons">
                <button type="button" id="btn-signup" class="btn-primary">Inscribete</button>
                <button type="button" id="btn-login" class="btn-secondary">Iniciar sesion</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
